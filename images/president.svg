<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="t">
  <title id="t">代表取締役 神本ゆうせいのポートレート（ロバ顔イラスト）</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffe1d2"/>
      <stop offset=".55" stop-color="#ffb3c1"/>
      <stop offset="1" stop-color="#ff7d98"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c8d80"/>
      <stop offset="1" stop-color="#857669"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b5c"/>
      <stop offset="1" stop-color="#0f1b3d"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- きらきら -->
  <g fill="#fff" opacity=".85">
    <path d="M60 90 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
    <path d="M335 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M330 60 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <circle cx="80" cy="230" r="4"/>
    <circle cx="350" cy="260" r="3"/>
  </g>

  <!-- スーツ -->
  <path d="M40 500 C 50 440, 110 410, 170 402 L 230 402 C 290 410, 350 440, 360 500 Z" fill="url(#suit)"/>
  <path d="M170 402 L200 470 L230 402 Z" fill="#fff"/>
  <path d="M192 418 L208 418 L214 470 L200 490 L186 470 Z" fill="#ff5a7a"/>
  <path d="M190 405 L210 405 L206 420 L194 420 Z" fill="#e0405f"/>
  <path d="M170 402 L150 412 L188 480 L200 470 Z" fill="#26386f"/>
  <path d="M230 402 L250 412 L212 480 L200 470 Z" fill="#26386f"/>
  <path d="M262 440 l18 -4 4 14 -18 4z" fill="#ff9a62"/>

  <!-- 耳 -->
  <g transform="rotate(-16 150 120)">
